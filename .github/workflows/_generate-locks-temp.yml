name: Generate dependency locks (temporary)

on:
  push:
    branches:
      - agent/reproducible-deps-xp-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lock compiler
        run: python -m pip install -r requirements-tools.txt

      - name: Compile locks
        run: python scripts/compile_requirements.py --upgrade

      - name: Commit generated locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt requirements-dev.txt
          if git diff --cached --quiet; then
            echo "Dependency locks already current."
          else
            git commit -m "build: refresh dependency locks"
            git push
          fi
