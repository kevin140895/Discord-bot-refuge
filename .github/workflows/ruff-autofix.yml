name: Ruff Autofix One-shot

on:
  push:
    branches:
      - agent/ci-quality-gate

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout quality-gate branch
        uses: actions/checkout@v6
        with:
          ref: agent/ci-quality-gate

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.2

      - name: Apply Ruff fixes
        run: python -m ruff check . --fix --unsafe-fixes

      - name: Remove one-shot workflow and commit fixes
        run: |
          git rm .github/workflows/ruff-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: satisfy Ruff quality gate"
          git push origin HEAD:agent/ci-quality-gate
