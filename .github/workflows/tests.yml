name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_DIR: ${{ github.workspace }}/.ci-data

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: dependency-lock (Python 3.11 production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned lock toolchain
        run: python -m pip install -r requirements-tools.txt

      - name: Regenerate dependency locks without upgrades
        run: python scripts/compile_requirements.py

      - name: Verify generated locks are committed
        run: git diff --exit-code -- requirements.txt requirements-dev.txt

  docker-runtime:
    name: docker-runtime (Python 3.11 production)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build hardened Docker image
        run: docker build --tag refuge-bot:ci .

      - name: Verify production Python runtime
        run: docker run --rm --entrypoint python refuge-bot:ci -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version; print(sys.version)'

      - name: Verify Docker non-root runtime
        run: |
          docker run --rm --entrypoint sh refuge-bot:ci -c '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test ! -e /app/.git
            deno --version
            ffmpeg -version >/dev/null
          '

      - name: Verify Railway volume bootstrap drops root
        run: |
          docker run --rm \
            --user 0:0 \
            --tmpfs /app/data:rw \
            -e RAILWAY_VOLUME_MOUNT_PATH=/app/data \
            refuge-bot:ci \
            sh -c '
              test "$(id -u)" = "10001"
              test "$(id -g)" = "10001"
              touch /app/data/.write-test
            '

      - name: Verify unexpected volume path is rejected
        run: |
          if docker run --rm \
            --user 0:0 \
            -e RAILWAY_VOLUME_MOUNT_PATH=/etc \
            refuge-bot:ci true; then
            echo "Unexpected Railway volume path was accepted" >&2
            exit 1
          fi

  pytest:
    name: pytest (Python ${{ matrix.python-version }} / ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            target: production
          - python-version: "3.12"
            target: migration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install dependencies from lock
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Run Discord rate-limit regression tests
        run: |
          python -m pytest -q \
            tests/test_radio_rate_limit_regressions.py \
            tests/test_music2_dynamic_rename.py \
            tests/test_api_meter_alert_classification.py \
            tests/test_rename_manager_isolation.py \
            tests/test_rename_manager_aclose.py \
            tests/test_rename_manager_deleted_channel.py \
            tests/test_radio_cog_does_not_start_rename_manager.py

      - name: Run test suite
        run: python -m pytest -q

  static-analysis:
    name: quality-gate (Python 3.11 production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt

      - name: Install development dependencies from lock
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy on production entrypoints and configuration
        if: always()
        run: python -m mypy main.py bot.py config.py

      - name: Compile Python sources
        if: always()
        run: python -m compileall -q main.py bot.py config.py cogs utils

      - name: Smoke-test core imports
        if: always()
        run: python -c "import bot, config, main; print('core imports ok')"

  dependency-audit:
    name: pip-audit (runtime dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.in
            requirements.txt
            requirements-dev.in
            requirements-dev.txt

      - name: Install audit tooling from lock
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Audit runtime dependency lock
        run: python -m pip_audit -r requirements.txt
